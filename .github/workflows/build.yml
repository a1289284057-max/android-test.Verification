#!/bin/bash
set -e

mkdir -p .github/workflows app/src/main/java/com/example/webapp

cat > settings.gradle << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "WebApp"
include ':app'
EOF

cat > build.gradle << 'EOF'
plugins {
    id 'com.android.application' version '8.5.2' apply false
}
EOF

cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
EOF

cat > app/build.gradle << 'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.webapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.webapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
EOF

cat > app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="true"
        android:label="我的网站"
        android:theme="@android:style/Theme.Material.Light.NoActionBar">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

    </application>
</manifest>
EOF

cat > app/src/main/java/com/example/webapp/MainActivity.java << 'EOF'
package com.example.webapp;

import android.app.Activity;
import android.content.SharedPreferences;
import android.graphics.Color;
import android.os.Bundle;
import android.view.Gravity;
import android.view.KeyEvent;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.Button;
import android.widget.LinearLayout;

import java.util.Locale;

public class MainActivity extends Activity {

    // ======== 在这里修改你的网站地址（中文版 / 英文版）========
    private static final String URL_ZH = "https://example.com/zh";
    private static final String URL_EN = "https://example.com/en";

    private static final String PREFS = "lang_prefs";
    private static final String KEY_LANG = "lang";

    private WebView webView;
    private Button btnZh;
    private Button btnEn;
    private String currentLang;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        // 读取上次选择的语言；第一次打开则根据系统语言决定
        SharedPreferences prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
        currentLang = prefs.getString(KEY_LANG, null);
        if (currentLang == null) {
            currentLang = Locale.getDefault().getLanguage().startsWith("zh") ? "zh" : "en";
        }

        // 整体布局：上面是语言切换栏，下面是网页
        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);

        LinearLayout bar = new LinearLayout(this);
        bar.setOrientation(LinearLayout.HORIZONTAL);
        bar.setGravity(Gravity.CENTER);
        bar.setBackgroundColor(Color.parseColor("#2196F3"));
        bar.setPadding(16, 12, 16, 12);

        btnZh = makeLangButton("中文", "zh");
        btnEn = makeLangButton("English", "en");

        LinearLayout.LayoutParams btnParams =
                new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
        btnParams.setMargins(8, 0, 8, 0);
        bar.addView(btnZh, btnParams);
        bar.addView(btnEn, btnParams);

        webView = new WebView(this);

        root.addView(bar, new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
        root.addView(webView, new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));
        setContentView(root);

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setLoadWithOverviewMode(true);
        settings.setUseWideViewPort(true);
        settings.setBuiltInZoomControls(false);

        // 所有链接都在应用内打开
        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient());

        if (savedInstanceState != null) {
            webView.restoreState(savedInstanceState);
        } else {
            loadLanguage(currentLang);
        }
        updateButtons();
    }

    private Button makeLangButton(String text, final String lang) {
        Button b = new Button(this);
        b.setText(text);
        b.setAllCaps(false);
        b.setOnClickListener(v -> switchLanguage(lang));
        return b;
    }

    private void switchLanguage(String lang) {
        if (lang.equals(currentLang)) return;
        currentLang = lang;
        getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString(KEY_LANG, lang).apply();
        loadLanguage(lang);
        updateButtons();
    }

    private void loadLanguage(String lang) {
        webView.loadUrl(lang.equals("zh") ? URL_ZH : URL_EN);
    }

    // 高亮当前选中的语言按钮
    private void updateButtons() {
        boolean zh = currentLang.equals("zh");
        btnZh.setBackgroundColor(zh ? Color.WHITE : Color.parseColor("#90CAF9"));
        btnZh.setTextColor(zh ? Color.parseColor("#2196F3") : Color.WHITE);
        btnEn.setBackgroundColor(!zh ? Color.WHITE : Color.parseColor("#90CAF9"));
        btnEn.setTextColor(!zh ? Color.parseColor("#2196F3") : Color.WHITE);
    }

    @Override
    protected void onSaveInstanceState(Bundle outState) {
        super.onSaveInstanceState(outState);
        webView.saveState(outState);
    }

    // 返回键：网页能后退就后退，否则退出应用
    @Override
    public boolean onKeyDown(int keyCode, KeyEvent event) {
        if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
            webView.goBack();
            return true;
        }
        return super.onKeyDown(keyCode, event);
    }
}
EOF

cat > .github/workflows/build-apk.yml << 'EOF'
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 编译 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
EOF

echo "✅ 项目文件已全部生成！"
